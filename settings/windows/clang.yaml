# LLVM's clang on Windows (the LLVM installer, or Visual Studio's clang component) against the
#  MSVC libraries: lld links, llvm-ar archives
super: settings

file:
  - type: cpp:cxx:cc
    archiver: llvm-ar rcs
    # MSVC's STL can require a newer clang than the installed LLVM (error STL1000), the define
    #  allows the pair until they match again
    compiler: clang++ -std=c++20 -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    linker: clang++ -fuse-ld=lld
