# AddressSanitizer: the flag on the compiler and the linker; tests and run get the instrumented
#  binaries (ASAN_OPTIONS through env, e.g. detect_leaks)
super: settings

property:
  asan: -fsanitize=address -fno-omit-frame-pointer

env:
  - name: ASAN_OPTIONS
    mode: replace
    value: detect_leaks=1

file:
  - type: cpp:cxx:cc
    archiver: ar -cr
    compiler: g++ -std=c++20 ${asan}
    linker: g++ ${asan}
