name: settings

# every settings example with a ci: runner in settings/catalog.yaml builds, tests and runs the
#  example project (example/) there with the released mkn. Weekly too: runner images change
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.catalog.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, yaml
          catalog = yaml.safe_load(open("settings/catalog.yaml"))
          include = [{"os": os, "file": e["file"], "runner": e["ci"]}
                     for os, group in catalog.items() for e in group["entries"] if e.get("ci")]
          print("include=" + json.dumps(include))
          PY

  example:
    needs: matrix
    name: ${{ matrix.os }}/${{ matrix.file }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache mold libopenmpi-dev openmpi-bin g++-14 clang-18 llvm-18
          curl -fsSLo mkn https://github.com/mkn/mkn/releases/latest/download/mkn_nix
      - if: runner.os == 'macOS'
        run: |
          brew install llvm gcc@14 || true
          curl -fsSLo mkn https://github.com/mkn/mkn/releases/latest/download/mkn_arm_osx
      - if: runner.os == 'Windows'
        run: curl -fsSLo mkn.exe https://github.com/mkn/mkn/releases/latest/download/mkn.exe
      - if: runner.os == 'Windows' && matrix.file == 'msvc.yaml'
        uses: ilammy/msvc-dev-cmd@v1

      - name: mkn clean build test run -x settings/${{ matrix.os }}/${{ matrix.file }}
        if: runner.os != 'Windows'
        working-directory: example
        run: |
          chmod +x ../mkn
          ../mkn -v
          KLOG=3 ../mkn clean build test run -p app -q -x "$GITHUB_WORKSPACE/settings/${{ matrix.os }}/${{ matrix.file }}"
      # PowerShell, not Git Bash: Git's link.exe (coreutils) would come before MSVC's
      - name: mkn clean build test run -x settings/${{ matrix.os }}/${{ matrix.file }}
        if: runner.os == 'Windows'
        working-directory: example
        shell: pwsh
        env:
          KLOG: 3
        run: |
          ../mkn.exe -v
          $props = @()
          # msvc_paths*: no Developer prompt; the runner's install found as the page describes
          if ("${{ matrix.file }}" -like "msvc_paths*") {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
            $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
            $sdkver = (Get-ChildItem "$sdk\Include" | Where-Object { Test-Path "$($_.FullName)\um\windows.h" } | Sort-Object Name | Select-Object -Last 1).Name
            $props = @("-P", "msvc=$vs/VC/Tools/MSVC/$ver,sdk=$sdk,sdk.version=$sdkver" -replace '\\','/')
            "properties: $($props[1])"
          }
          ../mkn.exe clean build test run -p app -q -x "$env:GITHUB_WORKSPACE/settings/${{ matrix.os }}/${{ matrix.file }}" @props
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
